name: 调研 → 写作 → 审稿
description: 先调研整理材料，再写正文，codex 以审稿人身份严格审读；不过就带着意见重写，最多 2 轮。适合文档、报告、论文章节。
lead: claude
nodes:
  - id: research
    kind: claude
    shared: true
    task: |
      主题：{{goal}}

      为这个主题收集写作需要的材料：读仓库里相关的文件和资料，需要时上网查。不要写正文，也不要修改仓库里的文件。
      把要点、每条要点的出处、还没弄清的问题整理成笔记，写进 $AF_OUT/research.md，用 --result 提交，outcome pass。
  - id: draft
    kind: claude
    after: [research]
    task: |
      主题：{{goal}}

      根据 $AF_OUT/research.md 里的调研笔记写正文。任务里没说写在哪，就新建 docs/ 下一个合适的 Markdown 文件。
      论点要有出处支撑，结构清楚；公式用 LaTeX。如果这是新一轮，先逐条处理审稿意见。
      提交 outcome pass，note 写文件路径和这一版的主要改动。
  - id: critique
    kind: codex
    after: [draft]
    shared: true
    autoAccept: true
    task: |
      主题：{{goal}}

      以严格审稿人的角度审读集成分支上新写的正文（git log / git diff 找到它）：论证是否成立、事实和出处是否对得上、
      结构和表达是否清楚。不要修改文件。可以接受就提交 outcome pass；
      否则提交 outcome fail，note 写最重要的修改意见（每条一句，最多 8 条）。
loops:
  - { from: critique, to: draft, on: fail, max: 2 }
