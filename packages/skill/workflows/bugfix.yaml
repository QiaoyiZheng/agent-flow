name: 修 bug
description: 先复现并定位，再修复并加回归测试，最后独立验证；验证不过就打回修复，最多 3 轮。
lead: claude
nodes:
  - id: reproduce
    kind: claude
    shared: true
    task: |
      问题：{{goal}}

      不要修改仓库里的文件。先复现这个问题：找到相关代码，写出最小的复现步骤（命令、输入、实际结果和期望结果），
      并指出你认为的原因（文件:行）。把这些写进 $AF_OUT/reproduce.md，用 --result 提交，outcome pass。
      复现不了就提交 outcome error，note 写你试过什么。
  - id: fix
    kind: codex
    after: [{ from: reproduce, on: pass }]
    task: |
      问题：{{goal}}

      输入里的 result 文件有复现方法和定位。修复这个问题，并加一个能防止它再次出现的测试。
      修完后按复现方法再跑一遍，确认问题消失。如果这是新一轮，先处理验证意见。
      提交 outcome pass，note 写原因和修法。
  - id: verify
    kind: claude
    after: [fix]
    shared: true
    autoAccept: true
    task: |
      问题：{{goal}}

      在集成分支上独立验证修复：按 $AF_OUT/reproduce.md 里的复现方法再跑一次，并跑相关测试。不要修改文件。
      问题确实消失、也没有引入新问题，就提交 outcome pass；否则提交 outcome fail，note 写还剩什么问题。
loops:
  - { from: verify, to: fix, on: fail, max: 3 }
