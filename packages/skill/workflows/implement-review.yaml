name: 实现 + 审查循环
description: codex 写代码，claude 审查；审查不通过就带着意见打回重写，最多 3 轮。适合一个目标明确的功能或改动。
lead: claude
nodes:
  - id: code
    kind: codex
    task: |
      目标：{{goal}}

      在当前仓库里实现这个目标。先读懂相关代码，改动保持小而集中；能跑的测试和检查都跑一遍。
      如果这是新一轮（任务里带着审查意见），先逐条处理这些意见。
      完成后提交 outcome pass，note 写清改了什么、怎么验证的。做不到就提交 outcome error，并说明卡在哪里。
  - id: review
    kind: claude
    after: [code]
    shared: true
    autoAccept: true
    task: |
      目标：{{goal}}

      审查集成分支上为这个目标做的改动（用 git log 和 git diff 查看；输入里有上一步的说明）。不要修改任何文件。
      检查三件事：目标是否真的实现了；有没有明显的 bug 或遗漏；测试能跑就跑，看是否通过。
      全部满足就提交 outcome pass；否则提交 outcome fail，note 里写具体、可以照着改的意见（每条一句）。
loops:
  - { from: review, to: code, on: fail, max: 3 }
